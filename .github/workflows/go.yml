name: Go

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Configure UDP socket buffers
        # https://github.com/quic-go/quic-go/wiki/UDP-Buffer-Sizes
        run: sudo sysctl -w net.core.rmem_max=7500000 net.core.wmem_max=7500000
      - name: Test capture analyzer
        run: |
          for source in tests/tools/wirecapture/*.mjs; do node --check "$source"; done
          node --test tests/tools/wirecapture/*.test.mjs
      - name: Test
        run: |
          coverage_packages="$(go list ./... | sed -E '/\/(examples|tests)(\/|$)/d' | paste -sd ',' -)"
          go test -race -count=1 -coverprofile=profile.cov -coverpkg="$coverage_packages" ./...
      - name: Vet
        run: go vet ./...
      - uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: profile.cov
