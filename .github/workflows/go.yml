name: Go

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-32-bit:
    name: Build linux/${{ matrix.goarch }}${{ matrix.goarm }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: '386'
            goarm: ''
          - goarch: arm
            goarm: '6'
          - goarch: arm
            goarm: '7'
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: Build production packages
        run: go build . ./header ./internal/... ./pkg/... ./profiles/...
      - name: Compile tests
        # Cross-compiled binaries cannot run on the host; true skips execution.
        run: go test -exec=true -run='^$' ./tests/...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Configure UDP socket buffers
        # https://github.com/quic-go/quic-go/wiki/UDP-Buffer-Sizes
        run: sudo sysctl -w net.core.rmem_max=7500000 net.core.wmem_max=7500000
      - name: Test capture analyzer
        run: |
          for source in tests/tools/{wirecapture,echresumption}/*.mjs; do node --check "$source"; done
          node --test tests/tools/{wirecapture,echresumption}/*.test.mjs
      - name: Test
        run: |
          coverage_packages="$(go list ./... | sed -E '/\/(examples|tests)(\/|$)/d' | paste -sd ',' -)"
          go test -race -count=1 -coverprofile=profile.cov -coverpkg="$coverage_packages" ./...
      - name: Vet
        run: go vet ./...
      - uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: profile.cov
